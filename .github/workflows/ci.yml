name: Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # The whole check on the supported floor and on the latest stable toolchain.
  # No service stack: the live suites run against a private stack. Cargo.toml
  # finds the client crate at ../sdk-rust-client, so both repositories are
  # checked out side by side.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88", stable]
    steps:
      - uses: actions/checkout@v5
        with:
          path: sdk-rust-server
      - uses: actions/checkout@v5
        with:
          repository: useceleris/sdk-rust-client
          path: sdk-rust-client
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: rustc --version
      - run: make check
        working-directory: sdk-rust-server
